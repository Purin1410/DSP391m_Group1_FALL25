### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct

image_max_pixels: 196608 #262144
video_max_pixels: 8192 #16384
trust_remote_code: true

### method
# stage: sft
# do_train: true
# finetuning_type: full
freeze_vision_tower: false # choices: [true, false]
freeze_multi_modal_projector: false # choices: [true, false]
freeze_language_model: false # choices: [true, false]
deepspeed: ds_z2_config.json

stage: sft
do_train: true
finetuning_type: lora 


### dataset
dataset: uni_mumer_train

template: qwen2_vl
cutoff_len: 1024 #2048
max_samples: 20000000
overwrite_cache: true
preprocessing_num_workers: 4 #128
dataloader_num_workers: 4

### output
output_dir: saves/qwen2.5_vl-3b/full/sft/standred/uni-mumer_full
logging_steps: 1
save_steps: 25
plot_loss: true
overwrite_output_dir: true
# report_to: tensorboard

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 32


learning_rate: 5.0e-4
num_train_epochs: 15.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: false
fp16: true
ddp_timeout: 180000000
save_only_model: true
resume_from_checkpoint: null
gradient_checkpointing: true
# max_grad_norm: 1.0
# weight_decay: 0.005
# label_smoothing_factor: 0.05

### eval
# eval_dataset: uni_mumer_val
# per_device_eval_batch_size: 2
# eval_strategy: epoch
# # eval_steps: 1000
eval_dataset: uni_mumer_val
do_eval: true            
eval_strategy: steps        
eval_steps: 25           
per_device_eval_batch_size: 4
eval_accumulation_steps: 32    
predict_with_generate: true 
max_new_tokens: 200


report_to: wandb
run_name: "Qwen_LoRA_3B_CROHME" #"Qwen_LoRA_3B_HME100K"